<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حكيم للعطور | Hakim Perfumes</title>
    <!-- استدعاء خطوط عربية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- تحميل Tailwind CSS مباشرة لتجنب أي مشاكل في التثبيت -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
              amiri: ['Amiri', 'serif'],
            },
            colors: {
              gold: {
                400: '#E5C158',
                500: '#D4AF37',
                600: '#B59024',
              },
              obsidian: '#0B0B0D',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0B0B0D] text-stone-100 font-['Cairo'] selection:bg-gold-500 selection:text-obsidian">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
